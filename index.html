<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Habitudes</title>
    <meta name="description" content="Suis tes habitudes, ta progression et leurs bienfaits." />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Habitudes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Appliquer le thème avant le premier affichage (évite un flash).
      try {
        const s = JSON.parse(localStorage.getItem('habitudes:v1') || '{}').settings;
        if (s && s.theme && s.theme !== 'auto') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <main id="main" tabindex="-1">
      <noscript>Habitudes a besoin de JavaScript pour fonctionner.</noscript>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Navigation principale"></nav>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
